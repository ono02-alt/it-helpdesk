default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>

development:
  <<: *default
  database: it_helpdesk_development

test:
  <<: *default
  database: it_helpdesk_test

production:
  <<: *default
  database: it_helpdesk_production
  username: it_helpdesk
  password: <%= ENV["IT_HELPDESK_DATABASE_PASSWORD"] %>