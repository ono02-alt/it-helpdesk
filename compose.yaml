services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: 1000
        GID: 1000
    command: sh -c "rm -f tmp/pids/server.pid && exec bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: